version: 2
# Minor/patch updates are grouped; majors arrive individually.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    # Raise a requirement's floor only when the current one will not resolve.
    versioning-strategy: "increase-if-necessary"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
