version: 2
# This repository had no Dependabot configuration, so nothing ever proposed an
# update and its pinned versions could drift silently. Node 20 is removed from
# GitHub-hosted runners on 2026-09-16, which is exactly the kind of deadline a
# repo with no update proposals walks into unwarned.
#
# Minor/patch are grouped to keep PR volume low. Majors arrive individually --
# those are the ones that carry runtime bumps and deserve their own CI run.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    # Dependabot's default for a repo it identifies as an APP (requirements.txt,
    # no packaging metadata) is to raise the minimum version to the newest
    # release -- so every torch/gradio release opens a floor-bump PR with no
    # functional driver. increase-if-necessary raises the floor only when the
    # current one genuinely will not resolve. Libraries are left on the default
    # (widen), which is already correct for them.
    versioning-strategy: "increase-if-necessary"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
