name: smoke

# Import/compile smoke check (there is no unit-test suite): the package still
# imports against the installed dependencies and every module still parses.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: import + compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch wheel; nothing here needs a GPU.
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Smoke
        run: python scripts/smoke.py
