name: smoke

# orchid-clip had no workflows at all, so pull requests got zero checks. That
# meant dependency PRs showed "mergeable / clean" while nothing had verified
# them -- "clean" only ever meant "no merge conflicts".
#
# There is no unit-test suite here, so this is an import/compile smoke rather
# than a test run. It is scoped to what a dependency bump actually breaks:
# whether the package still imports against the installed torch / Pillow /
# open_clip, and whether every module still parses.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: import + compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: nothing here touches a GPU and the default wheel
          # drags ~2 GB of CUDA payload onto the runner for nothing.
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Smoke
        run: python scripts/smoke.py
